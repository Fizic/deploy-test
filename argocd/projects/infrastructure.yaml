apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-project
    app.kubernetes.io/part-of: argocd
spec:
  description: Infrastructure services project
  sourceRepos:
    - https://github.com/Fizic/deploy-test.git
    - https://github.com/Fizic/deploy-test/*
    - https://metallb.github.io/metallb
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://openebs.github.io/dynamic-localpv-provisioner
    - https://argoproj.github.io/argo-helm
    - https://charts.bitnami.com/bitnami
    - https://helm.releases.hashicorp.com
    - https://charts.gitlab.io
    - https://plane.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: openebs
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: project-admin
      description: Project admin role
      policies:
        - p, proj:infrastructure:project-admin, applications, *, */*, allow
        - p, proj:infrastructure:project-admin, clusters, *, */*, allow
        - p, proj:infrastructure:project-admin, repositories, *, */*, allow
        - p, proj:infrastructure:project-admin, projects, *, */*, allow
      groups:
        - argocd-admins
  orphanedResources:
    warn: false
