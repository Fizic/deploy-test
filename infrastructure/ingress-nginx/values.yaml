# Ingress-Nginx Configuration
# Helm chart version: 4.15.x (stable)
# Documentation: https://kubernetes.github.io/ingress-nginx/

controller:
  name: controller
  image:
    repository: registry.k8s.io/ingress-nginx/controller
    tag: "v1.15.1"
    digest: ""
    pullPolicy: IfNotPresent
  
  replicaCount: 2
  
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  service:
    enabled: true
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: 192.168.100.110
    externalTrafficPolicy: Local
    healthCheckNodePort: 0
    ports:
      http: 80
      https: 443
      metrics: 10254

  config:
    use-forwarded-headers: "true"
    use-proxy-protocol: "false"
    compute-full-forwarded-for: "true"
    use-forwarded-for: "true"
    proxy-body-size: "50m"
    proxy-read-timeout: "300"
    proxy-send-timeout: "300"
    enable-underscores-in-headers: "true"
    ignore-invalid-headers: "true"
    large-client-header-buffers: "4 16k"
    client-header-buffer-size: "4k"
    keep-alive: "75"
    keep-alive-requests: "1000"
    GODEBUG: "http2server=0"
    enable-brotli: "true"
    brotli-level: "6"
    brotli-types: "application/json application/javascript application/xml text/css text/html text/javascript text/plain text/xml"
    ssl-protocols: "TLSv1.2 TLSv1.3"
    ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    ssl-prefer-server-ciphers: "false"
    hsts-max-age: "15724800"
    hsts-include-subdomains: "true"
    hsts-preload: "true"
    force-ssl-redirect: "true"

  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: k8s.io/ingress-nginx

  admissionWebhooks:
    enabled: true
    createSecretJob:
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          cpu: 100m
          memory: 100Mi
    patchWebhookJob:
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          cpu: 100m
          memory: 100Mi
    patch:
      enabled: true
      image:
        repository: registry.k8s.io/ingress-nginx/kube-webhook-certgen
        tag: "v1.4.0"
        pullPolicy: IfNotPresent

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      selfMonitor: true
    prometheusRule:
      enabled: true
      rules:
        - alert: NGINXIngressControllerDown
          expr: absent(up{job="nginx-ingress-ingress-nginx-controller-metrics"})
          for: 1m
          labels:
            severity: critical
          annotations:
            description: NGINX Ingress Controller is down
            summary: NGINX Ingress Controller is down

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller

  priorityClassName: system-cluster-critical

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
    prometheus.io/path: /metrics

defaultBackend:
  enabled: true
  image:
    repository: registry.k8s.io/ingress-nginx/defaultbackend-amd64
    tag: "1.5"
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

  service:
    type: ClusterIP
    externalTrafficPolicy: Local

  priorityClassName: system-cluster-critical
