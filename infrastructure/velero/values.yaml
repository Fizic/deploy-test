# Velero Backup Configuration
# Helm chart: vmware-tanzu/velero
# Documentation: https://velero.io/docs/

namespace: velero

# Velero configuration
config:
  region: minio
  s3ForcePathStyle: "true"

# Credentials
credentials:
  enabled: true
  existingSecret: velero-credentials
  secretContents:
    cloud: |
      [default]
      aws_access_key_id = minio
      aws_secret_access_key = minio123

# Image
image:
  repository: velero/velero
  tag: "1.15.1"
  pullPolicy: IfNotPresent

# Init containers
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.1
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - name: plugins
        mountPath: /target

# Service account
serviceAccount:
  server:
    create: true
    name: velero-server
    annotations:
      argocd.argoproj.io/hook-type: SkipDryRunOnGenerateResource

# Snapshots
snapshots:
  enabled: true

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Security context
securityContext:
  fsGroup: 65534
  runAsNonRoot: true
  runAsUser: 65534

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Schedule backup every day at 2 AM
schedules:
  daily-backup:
    enabled: true
    schedule: "0 2 * * *"
    template:
      ttl: 720h
      includedNamespaces:
        - argocd
        - keycloak
        - vault
        - gitlab
        - docmost
        - plane
        - services
        - monitoring
      excludedResources:
        - events
        - events.events.k8s.io
      storageLocation: default
      volumeSnapshotLocations:
        - default
      hooks:
        resources:
          - name: postgresql-backup
            includedNamespaces:
              - "*"
            selector:
              matchLabels:
                app.kubernetes.io/name: postgresql
            pre:
              - exec:
                  container: postgresql
                  command:
                    - /bin/bash
                    - -c
                    - pg_dump -U postgres > /tmp/backup.sql
                  onError: Fail
                  timeout: 300s
            post:
              - exec:
                  container: postgresql
                  command:
                    - /bin/bash
                    - -c
                    - rm /tmp/backup.sql
                  onError: Continue
                  timeout: 60s

# Backup storage location
backupStorageLocation:
  enabled: true
  name: default
  provider: aws
  config:
    region: minio
    s3ForcePathStyle: "true"
    s3Url: http://minio.logging.svc.cluster.local:9000
    publicUrl: https://minio.demo.quximo.com
  default: true
  backupSyncPeriod: 2h
  getAllSnapshotsPeriod: 1h
  podVolumeSnapshotRetention:
    enabled: false
  volumeSnapshotLocation: default

# Volume snapshot location
volumeSnapshotLocation:
  enabled: true
  name: default
  provider: aws
  config:
    region: minio

# Node agent (for pod volume backups)
nodeAgent:
  enabled: true
  podVolumeOperationTimeout: 240m
  uploaderType: restic
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - operator: Exists
  nodeSelector:
    kubernetes.io/os: linux
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/os
                operator: In
                values:
                  - linux
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

# Metrics
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Service
service:
  type: ClusterIP
  port: 8085
  targetPort: 8085

# Ingress
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  hosts:
    - host: velero.demo.quximo.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: velero-tls
      hosts:
        - velero.demo.quximo.com

# annotations for deployed resources
annotations: {}

# labels for deployed resources
labels: {}

# tolerations for deployed resources
tolerations: []

# nodeSelector for deployed resources
nodeSelector: {}
