# ArgoCD Configuration
# Helm chart: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

server:
  image:
    repository: quay.io/argoproj/argocd
    tag: "v2.13.3"
    pullPolicy: IfNotPresent
  
  replicaCount: 2
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: 70

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  service:
    type: ClusterIP
    servicePortHttp: 80
    servicePortHttps: 443
    servicePortHttpName: http
    servicePortHttpsName: https

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/connection-header: "keep-alive"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    path: /
    pathType: Prefix
    hosts:
      - argocd.demo.quximo.com
    tls:
      - secretName: argocd-server-tls
        hosts:
          - argocd.demo.quximo.com

  config:
    url: https://argocd.demo.quximo.com
    application.instanceLabelKey: argocd.argoproj.io/instance
    resource.customizations: |
      argoproj.io/Application:
        health.lua: |
          hs = {}
          hs.status = "Progressing"
          hs.message = ""
          if obj.status ~= nil then
            if obj.status.health ~= nil then
              hs.status = obj.status.health.status
              if obj.status.health.message ~= nil then
                hs.message = obj.status.health.message
              end
            end
          end
          return hs

  rbac:
    policy.csv: |
      g, system:cluster-admins, role:admin
      g, argocd-admins, role:admin
      g, argocd-edit, role:edit
      g, argocd-view, role:readonly
    policy.default: role:readonly
    scopes: "[groups]"

  cmdParams:
    loglevel: info
    statusBadgeEnabled: "true"
    proxyXgbNumber: "0"
    limitsMaxConcurrentReconciles: "50"
    limitsNumberOfConcurrentReconciles: "3"

repoServer:
  image:
    repository: quay.io/argoproj/argocd
    tag: "v2.13.3"
    pullPolicy: IfNotPresent

  replicaCount: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  service:
    servicePortHttp: 8081
    servicePortSsh: 22

  volumes:
    - name: ssh-known-hosts
      configMap:
        name: argocd-ssh-known-hosts-cm
        defaultMode: 256
    - name: tls-certs
      configMap:
        name: argocd-tls-certs-cm
        defaultMode: 256
    - name: gpg-keys
      configMap:
        name: argocd-gpg-keys-cm
        defaultMode: 256

  volumeMounts:
    - name: ssh-known-hosts
      mountPath: /app/config/ssh
    - name: tls-certs
      mountPath: /app/config/tls
    - name: gpg-keys
      mountPath: /app/config/gpg/keyring

  initContainers:
    - name: download-tools
      image: alpine:3.19
      command:
        - sh
        - -c
        - |
          apk add git
          git config --global --add safe.directory '*'
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd

controller:
  image:
    repository: quay.io/argoproj/argocd
    tag: "v2.13.3"
    pullPolicy: IfNotPresent

  replicas: 2

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  sharding.enabled: false
  sharding.replicas: 1

  serviceAccount:
    create: true
    name: argocd-application-controller

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

  configMap:
    application.instanceLabelKey: argocd.argoproj.io/instance

dex:
  enabled: false

redis:
  enabled: true
  image:
    repository: redis
    tag: "7.4.1-alpine"
    pullPolicy: IfNotPresent

  replicaCount: 1

  autoscaling:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  service:
    type: ClusterIP

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

notifications:
  enabled: false

# Global settings
global:
  imagePullSecrets: []
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

  podAnnotations:
    checksum/config: ""
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: /metrics

  priorityClassName: system-cluster-critical

  tolerations: []

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - argo-cd
                    - argocd
            topologyKey: kubernetes.io/hostname

# Notifications (optional)
notifications:
  enabled: false

# Argo CD ApplicationSet Controller
applicationSet:
  enabled: true
  image:
    repository: quay.io/argoproj/argocd
    tag: "v2.13.3"
    pullPolicy: IfNotPresent

  replicaCount: 2

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  serviceAccount:
    create: true
    name: argocd-applicationset-controller

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Extra config
fullnameOverride: ""

nameOverride: ""

serviceAccounts:
  argocdServer:
    create: true
    name: argocd-server
    labels: {}
    annotations: {}

  argocdRepoServer:
    create: true
    name: argocd-repo-server
    labels: {}
    annotations: {}

  argocdServer:
    create: true
    name: argocd-server
    labels: {}
    annotations: {}

  argocdApplicationController:
    create: true
    name: argocd-application-controller
    labels: {}
    annotations: {}
