# Plane Helm Chart Values
# Chart: https://github.com/makeplane/helm-charts
# Documentation: https://docs.plane.so/self-hosting/methods/kubernetes

namespace: plane

# Global settings
global:
  storageClass: openebs-hostpath
  imagePullSecrets: []

# Control plane (API and web)
controlplane:
  enabled: true
  replicaCount: 2

  image:
    repository: makeplane/plane-backend
    tag: "2.0.1"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"

  securityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

  initContainers:
    - name: wait-for-db
      image: postgres:15-alpine
      command:
        - sh
        - -c
        - |
          until pg_isready -h postgresql.plane.svc.cluster.local -p 5432 -U plane; do
            echo "Waiting for database..."
            sleep 5
          done
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      nginx.ingress.kubernetes.io/websocket-read-buffer: "0"
      nginx.ingress.kubernetes.io/websocket-write-buffer: "0"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    hosts:
      - host: plane.demo.quximo.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: plane-tls
        hosts:
          - plane.demo.quximo.com

  env:
    - name: DEBUG
      value: "0"
    - name: CSRF_TRUSTED_ORIGINS
      value: "https://plane.demo.quximo.com"
    - name: SITE_URL
      value: "https://plane.demo.quximo.com"
    - name: DATA_STORE_URL
      value: "http://plane-data-store.plane.svc.cluster.local:9000"
    - name: DATA_STORE_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: plane-redis-secret
          key: url
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: plane-app-secret
          key: secretKey
    - name: PGHOST
      value: "postgresql.plane.svc.cluster.local"
    - name: PGPORT
      value: "5432"
    - name: PGDATABASE
      value: "plane"
    - name: PGUSER
      value: "plane"
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: password
    - name: EMAIL_HOST
      value: ""
    - name: EMAIL_PORT
      value: "587"
    - name: EMAIL_HOST_USER
      value: ""
    - name: EMAIL_HOST_PASSWORD
      value: ""
    - name: EMAIL_FROM
      value: ""
    - name: EMAIL_USE_TLS
      value: "True"
    - name: SENTRY_DSN
      value: ""
    - name: SENTRY_ORG
      value: ""
    - name: SENTRY_PROJECT
      value: ""
    - name: SENTRY_API_HOST
      value: ""

  livenessProbe:
    enabled: true
    path: /api/v1/workspaces/
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    path: /api/v1/workspaces/
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Web (Frontend)
web:
  enabled: true
  replicaCount: 2

  image:
    repository: makeplane/plane-frontend
    tag: "2.0.1"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  securityContext:
    fsGroup: 1000
    runAsUser: 1000
    runAsGroup: 1000

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  env:
    - name: NEXT_PUBLIC_API_BASE_URL
      value: "https://plane.demo.quximo.com/api/v1"
    - name: NEXT_PUBLIC_APP_BASE_URL
      value: "https://plane.demo.quximo.com"
    - name: NEXT_PUBLIC_CKEDITOR_CLASS_BUILDER_URL
      value: "https://plane.demo.quximo.com/api/v1/factories/"
    - name: NEXT_PUBLIC_CKEDITOR_BASE_URL
      value: "https://plane.demo.quximo.com/api/v1/editor/"
    - name: NEXT_PUBLIC_POSTHOG_KEY
      value: ""
    - name: NEXT_PUBLIC_POSTHOG_HOST
      value: ""
    - name: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
      value: ""
    - name: SENTRY_DSN
      value: ""
    - name: SENTRY_ORG
      value: ""
    - name: SENTRY_PROJECT
      value: ""
    - name: SENTRY_API_HOST
      value: ""

  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Space (Documentation)
space:
  enabled: true
  replicaCount: 2

  image:
    repository: makeplane/plane-space
    tag: "2.0.1"
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  securityContext:
    fsGroup: 1000
    runAsUser: 1000

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  env:
    - name: NEXT_PUBLIC_API_BASE_URL
      value: "https://plane.demo.quximo.com/api/v1"
    - name: NEXT_PUBLIC_APP_BASE_URL
      value: "https://space.demo.quximo.com"
    - name: SENTRY_DSN
      value: ""

# Worker (Background jobs)
worker:
  enabled: true
  replicaCount: 2

  image:
    repository: makeplane/plane-backend
    tag: "2.0.1"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  securityContext:
    fsGroup: 1000
    runAsUser: 1000

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  env:
    - name: DATA_STORE_URL
      value: "http://plane-data-store.plane.svc.cluster.local:9000"
    - name: DATA_STORE_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: plane-redis-secret
          key: url
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: plane-app-secret
          key: secretKey
    - name: PGHOST
      value: "postgresql.plane.svc.cluster.local"
    - name: PGPORT
      value: "5432"
    - name: PGDATABASE
      value: "plane"
    - name: PGUSER
      value: "plane"
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: password

# Beat (Scheduled jobs)
beat:
  enabled: true
  replicaCount: 1

  image:
    repository: makeplane/plane-backend
    tag: "2.0.1"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

  env:
    - name: DATA_STORE_URL
      value: "http://plane-data-store.plane.svc.cluster.local:9000"
    - name: DATA_STORE_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: url
    - name: REDIS_URL
      valueFrom:
        secretKeyRef:
          name: plane-redis-secret
          key: url
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: plane-app-secret
          key: secretKey
    - name: PGHOST
      value: "postgresql.plane.svc.cluster.local"
    - name: PGPORT
      value: "5432"
    - name: PGDATABASE
      value: "plane"
    - name: PGUSER
      value: "plane"
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: password

# Data Store (MinIO-like storage)
datastore:
  enabled: true
  replicaCount: 1

  image:
    repository: makeplane/plane-datastore
    tag: "2.0.1"
    pullPolicy: IfNotPresent

  persistence:
    enabled: true
    storageClass: openebs-hostpath
    size: 20Gi
    accessMode: ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  env:
    - name: DB_HOST
      value: "postgresql.plane.svc.cluster.local"
    - name: DB_PORT
      value: "5432"
    - name: DB_NAME
      value: "plane"
    - name: DB_USER
      value: "plane"
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: password

# Migrator (Database migrations)
migrator:
  enabled: true
  image:
    repository: makeplane/plane-backend
    tag: "2.0.1"
    pullPolicy: IfNotPresent

  env:
    - name: DATA_STORE_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: url
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: plane-app-secret
          key: secretKey
    - name: PGHOST
      value: "postgresql.plane.svc.cluster.local"
    - name: PGPORT
      value: "5432"
    - name: PGDATABASE
      value: "plane"
    - name: PGUSER
      value: "plane"
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: plane-db-secret
          key: password

# PostgreSQL
postgresql:
  enabled: true
  auth:
    username: plane
    password: ""
    database: plane
  primary:
    persistence:
      enabled: true
      storageClass: openebs-hostpath
      size: 50Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

# Redis
redis:
  enabled: true
  auth:
    enabled: true
    password: ""
  master:
    persistence:
      enabled: true
      storageClass: openebs-hostpath
      size: 5Gi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
  replica:
    persistence:
      enabled: true
      storageClass: openebs-hostpath
      size: 5Gi
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

# Ingress for space subdomain
spaceIngress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: space.demo.quximo.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: plane-space-tls
      hosts:
        - space.demo.quximo.com

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - plane
                  - plane-backend
                  - plane-frontend
          topologyKey: kubernetes.io/hostname

# Node selector
nodeSelector:
  kubernetes.io/os: linux

# Tolerations
tolerations: []
