# Vault Helm Chart Values
# Helm chart: hashicorp/vault
# Documentation: https://developer.hashicorp.com/vault/docs/platform/k8s/helm

# Namespace
namespace: vault

# Installer configuration
global:
  enabled: true
  tlsDisable: false
  # Using a external CA for TLS
  # externalVaultAddr: ""
  # Service account
  serviceAccount:
    create: true
    name: vault
    annotations: {}
  # Kubernetes image pull secrets
  imagePullSecrets: []

# Vault server configuration
server:
  image:
    repository: hashicorp/vault
    tag: "1.17.2"
    pullPolicy: IfNotPresent

  # Update strategy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

  # Replica count
  replicas: 3

  # Ha stateful set
  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: false
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 0
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          telemetry {
            unauthenticated_metrics_access = true
          }
        }
        storage "raft" {
          path = "/vault/data"
          retry_join {
            leader_api_addr = "https://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "https://vault-2.vault-internal:8200"
          }
        }
        service_registration "kubernetes" {}
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }
        log_level = "info"
        default_lease_ttl = "168h"
        max_lease_ttl = "720h"

  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: openebs-hostpath
    accessMode: ReadWriteOnce
    annotations: {}

  # Audit storage
  auditStorage:
    enabled: false
    size: 10Gi
    storageClass: openebs-hostpath
    accessMode: ReadWriteOnce

  # PodDisruptionBudget
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  # Resources
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  # Security context
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 100

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
      add:
        - IPC_LOCK
        - NET_BIND_SERVICE

  # Liveness probe
  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 2
    timeoutSeconds: 3
    successThreshold: 1

  # Readiness probe
  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&activecode=200&uninitcode=200"
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 2
    timeoutSeconds: 3
    successThreshold: 1

  # Startup probe
  startupProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 60
    timeoutSeconds: 3
    successThreshold: 1

  # Service
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200
    clusterIP: ""
    annotations: {}

  # Ingress
  ingress:
    enabled: true
    ingressClassName: nginx
    labels:
      app.kubernetes.io/name: vault
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
      nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
      nginx.ingress.kubernetes.io/configuration-snippet: |
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    hosts:
      - host: vault.demo.quximo.com
        paths: []
    tls:
      - secretName: vault-tls
        hosts:
          - vault.demo.quximo.com

  # Volume mounts
  volumes: []
    # - name: userconfig-volume
    #   emptyDir: {}

  volumeMounts: []
    # - name: userconfig-volume
    #   mountPath: /vault/userconfig

  # Affinity
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - vault
            topologyKey: kubernetes.io/hostname

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Topology constraints
  topologySpreadConstraints: []

# Injector (for CSI provider or init containers)
injector:
  enabled: true
  replicas: 2
  image:
    repository: hashicorp/vault-k8s
    tag: "1.4.2"
    pullPolicy: IfNotPresent

  # External vault address
  externalVaultAddr: ""

  # Leader elector
  leaderElector:
    enabled: true
    image:
      repository: hashicorp/consul-template
      tag: "0.36.0"
      pullPolicy: IfNotPresent

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Security context
  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 100

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Service
  service:
    enabled: true
    type: ClusterIP
    port: 443
    targetPort: 8080

  # Metrics
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
      scrapeTimeout: 10s
      selectors: {}

  # PodDisruptionBudget
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  # Affinity
  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - vault
                    - vault-agent-injector
            topologyKey: kubernetes.io/hostname

# CSI Provider
csi:
  enabled: true
  image:
    repository: hashicorp/vault-csi-provider
    tag: "1.4.2"
    pullPolicy: IfNotPresent

  replicas: 2

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  securityContext:
    fsGroup: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 100

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  serviceAccount:
    create: true
    name: vault-csi-provider
    annotations: {}

# UI
ui:
  enabled: true
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    annotations: {}

# Server metrics
prometheus:
  enabled: true
  port: 9102
  podMonitor:
    enabled: true
    namespace: monitoring
    interval: 30s
    scrapeTimeout: 10s
    selectors:
      app.kubernetes.io/name: vault
