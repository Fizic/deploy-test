# Docmost Helm Chart
# Chart: https://github.com/docmost/helm-charts
# Documentation: https://docmost.com/docs/installation

apiVersion: v2
name: docmost
description: A collaborative wiki and documentation platform
type: application
version: 0.1.3
appVersion: "latest"
keywords:
  - docmost
  - wiki
  - documentation
  - collaboration
home: https://docmost.com
sources:
  - https://github.com/docmost/helm-charts
  - https://github.com/Docmost/Docmost
maintainers:
  - name: Docmost Community

dependencies: []

namespace: docmost

# Default values for docmost chart
replicas: 1

image:
  repository: docmost/docmost
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
  hosts:
    - host: docmost.demo.quximo.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: docmost-tls
      hosts:
        - docmost.demo.quximo.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

persistence:
  enabled: true
  storageClass: openebs-hostpath
  size: 5Gi
  accessMode: ReadWriteOnce

# Database configuration
database:
  host: postgresql.docmost.svc.cluster.local
  port: 5432
  name: docmost
  user: docmost
  existingSecret: docmost-db-secret
  secretKey: password

# Redis configuration
redis:
  host: redis.docmost.svc.cluster.local
  port: 6379
  existingSecret: docmost-redis-secret
  secretKey: redis-password

# App configuration
app:
  secretKey: ""
  existingSecret: docmost-app-secret
  baseUrl: https://docmost.demo.quximo.com
  allowSignups: "true"
  smtp:
    enabled: false
    host: ""
    port: 587
    user: ""
    existingSecret: ""
    fromAddress: ""

# Security context
securityContext:
  enabled: true
  fsGroup: 1000
  runAsUser: 1000

containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Health checks
livenessProbe:
  enabled: true
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: /metrics

# PodDisruptionBudget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Node selector
nodeSelector:
  kubernetes.io/os: linux

# Tolerations
tolerations: []

# Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - docmost
          topologyKey: kubernetes.io/hostname

# Init containers
initContainers: []

# Sidecars
sidecars: []

# Extra environment variables
extraEnv: []

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []
