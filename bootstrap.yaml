# ArgoCD Bootstrap - Complete GitOps Deployment
# One-time apply: kubectl apply -f bootstrap.yaml
# 
# This creates:
#   - 3 AppProjects (infrastructure, services, monitoring)
#   - 10 Applications for all services
#
# Prerequisites:
#   argocd repo add https://github.com/Fizic/deploy-test.git
#
# GitHub: https://github.com/Fizic/deploy-test
# Branch: master

---
# ============================================
# AppProjects
# ============================================

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-project
    app.kubernetes.io/part-of: argocd
spec:
  description: Infrastructure services project
  sourceRepos:
    - https://github.com/Fizic/deploy-test.git
    - https://github.com/Fizic/deploy-test/*
    - https://metallb.github.io/metallb
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://openebs.github.io/dynamic-localpv-provisioner
    - https://argoproj.github.io/argo-helm
    - https://charts.bitnami.com/bitnami
    - https://helm.releases.hashicorp.com
    - https://charts.gitlab.io
    - https://plane.github.io/helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: openebs
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: project-admin
      description: Project admin role
      policies:
        - p, proj:infrastructure:project-admin, applications, *, */*, allow
        - p, proj:infrastructure:project-admin, clusters, *, */*, allow
        - p, proj:infrastructure:project-admin, repositories, *, */*, allow
        - p, proj:infrastructure:project-admin, projects, *, */*, allow
      groups:
        - argocd-admins
  orphanedResources:
    warn: false

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: services
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-project
    app.kubernetes.io/part-of: argocd
spec:
  description: Application services project
  sourceRepos:
    - https://github.com/Fizic/deploy-test.git
    - https://github.com/Fizic/deploy-test/*
    - https://charts.bitnami.com/bitnami
    - https://helm.releases.hashicorp.com
    - https://charts.gitlab.io
    - https://plane.github.io/helm-charts
    - https://raw.githubusercontent.com/docmost/helm/refs/heads/main
  destinations:
    - server: https://kubernetes.default.svc
      namespace: services
    - server: https://kubernetes.default.svc
      namespace: keycloak
    - server: https://kubernetes.default.svc
      namespace: vault
    - server: https://kubernetes.default.svc
      namespace: gitlab
    - server: https://kubernetes.default.svc
      namespace: docmost
    - server: https://kubernetes.default.svc
      namespace: plane
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: project-admin
      description: Project admin role
      policies:
        - p, proj:services:project-admin, applications, *, */*, allow
        - p, proj:services:project-admin, clusters, *, */*, allow
        - p, proj:services:project-admin, repositories, *, */*, allow
        - p, proj:services:project-admin, projects, *, */*, allow
      groups:
        - argocd-admins
  orphanedResources:
    warn: false

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-project
    app.kubernetes.io/part-of: argocd
spec:
  description: Monitoring and observability project
  sourceRepos:
    - https://github.com/Fizic/deploy-test.git
    - https://github.com/Fizic/deploy-test/*
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: velero
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: project-admin
      description: Project admin role
      policies:
        - p, proj:monitoring:project-admin, applications, *, */*, allow
        - p, proj:monitoring:project-admin, clusters, *, */*, allow
        - p, proj:monitoring:project-admin, repositories, *, */*, allow
        - p, proj:monitoring:project-admin, projects, *, */*, allow
      groups:
        - argocd-admins
  orphanedResources:
    warn: false

---
# ============================================
# Applications - Infrastructure
# ============================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/name: infrastructure
    app.kubernetes.io/part-of: argocd-apps
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/Fizic/deploy-test.git
    targetRevision: master
    path: infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
# ============================================
# Applications - Services
# ============================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: services
spec:
  project: services
  source:
    repoURL: https://github.com/Fizic/deploy-test.git
    targetRevision: master
    path: services/keycloak
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 10m

