apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  labels:
    app.kubernetes.io/name: metallb
    app.kubernetes.io/part-of: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/metallb/helm-charts.git
    targetRevision: "0.14.5"
    chart: metallb
    helm:
      values: |
        controller:
          image:
            repository: registry.k8s.io/metallb/controller
            tag: "v0.14.5"
        speaker:
          image:
            repository: registry.k8s.io/metallb/speaker
            tag: "v0.14.5"
        prometheus:
          metrics:
            enabled: true
        crds:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSync=true
    retry:
      limit: 3
