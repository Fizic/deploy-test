apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-grafana
  namespace: argocd
  labels:
    app.kubernetes.io/name: prometheus-grafana
    app.kubernetes.io/part-of: infrastructure
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: infrastructure
  dependsOn:
    - name: cert-manager-issuer
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: "60.7.0"
    chart: kube-prometheus-stack
    helm:
      values: |
        namespaceOverride: monitoring
        alertmanager:
          enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - alertmanager.demo.quximo.com
            tls:
              - secretName: alertmanager-tls
                hosts:
                  - alertmanager.demo.quximo.com
          alertmanagerSpec:
            replicas: 2
            retention: 120h
            storage:
              enabled: true
              storageClass: openebs-hostpath
              size: 5Gi
        prometheus:
          enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - prometheus.demo.quximo.com
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.demo.quximo.com
          prometheusSpec:
            replicas: 2
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: openebs-hostpath
                  resources:
                    requests:
                      storage: 50Gi
        grafana:
          enabled: true
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - grafana.demo.quximo.com
            path: /
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.demo.quximo.com
          persistence:
            enabled: true
            storageClassName: openebs-hostpath
            size: 10Gi
          serviceMonitor:
            enabled: true
        prometheusOperator:
          enabled: true
          admissionWebhooks:
            certManager:
              enabled: true
        kubeStateMetrics:
          enabled: true
        nodeExporter:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSync=true
    retry:
      limit: 3
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /spec/replicas
        - /spec/storage
    - group: monitoring.coreos.com
      kind: Alertmanager
      jsonPointers:
        - /spec/replicas
