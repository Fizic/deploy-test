apiVersion: v1
kind: Namespace
metadata:
  name: plane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane
  namespace: plane
---
apiVersion: v1
kind: Service
metadata:
  name: plane-web
  namespace: plane
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: plane-web
---
apiVersion: v1
kind: Service
metadata:
  name: plane-backend
  namespace: plane
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: plane-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-web
  namespace: plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plane-web
  template:
    metadata:
      labels:
        app: plane-web
    spec:
      serviceAccountName: plane
      containers:
        - name: plane-web
          image: makeplane/plane-web:0.22.0
          env:
            - name: APP_URL
              value: "https://plane.demo.quximo.com"
            - name: SPACE_TYPE
              value: "local"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-backend
  namespace: plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plane-backend
  template:
    metadata:
      labels:
        app: plane-backend
    spec:
      containers:
        - name: plane-backend
          image: makeplane/plane-backend:0.22.0
          env:
            - name: DATABASE_URL
              value: "postgresql://plane:plane@plane-db:5432/plane"
            - name: REDIS_URL
              value: "redis://plane-redis:6379"
            - name: WEB_URL
              value: "http://plane-backend:8000"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plane
  namespace: plane
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - plane.demo.quximo.com
      secretName: plane-tls
  rules:
    - host: plane.demo.quximo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plane-web
                port:
                  number: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: plane-db
  namespace: plane
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: plane-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-db
  namespace: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-db
  template:
    metadata:
      labels:
        app: plane-db
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: plane
            - name: POSTGRES_USER
              value: plane
            - name: POSTGRES_PASSWORD
              value: plane
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: plane-db-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plane-db-data
  namespace: plane
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: plane-redis
  namespace: plane
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: plane-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plane-redis
  namespace: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plane-redis
  template:
    metadata:
      labels:
        app: plane-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
